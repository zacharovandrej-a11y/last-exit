<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAST EXIT</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#120606"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#120606;overflow:hidden;-webkit-user-select:none;user-select:none;font-family:system-ui,sans-serif;color:#fff}
canvas#g,canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#c{touch-action:none}
#weapons{position:fixed;left:50%;bottom:calc(54px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(318px,calc(100vw - 32px));display:flex;gap:4px;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x;scroll-snap-type:x mandatory;scrollbar-width:thin}
#weapons[hidden]{display:none}
#weapons button{box-sizing:border-box;flex:0 0 calc((100% - 8px) / 3);scroll-snap-align:start;min-width:0;height:48px;padding:2px;display:grid;place-items:center;border:1px solid #9b7a6d;border-radius:8px;background:rgba(29,16,12,.92);box-shadow:none}
#weapons img{width:100%;height:42px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 1px 1px #000b)}
#weapons button[aria-pressed="true"]{color:#ffd43b;border-color:#ffd43b;background:#3e2b16}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 120%,#6b0d0d 0,#2a0808 30%,#0c0404 65%);overflow:auto;padding:12px;box-sizing:border-box}
.scr.on{display:flex}
h1{margin:0;font-size:min(64px,12vw,13vh);font-weight:900;color:#ff3b3b;letter-spacing:4px;text-shadow:0 4px 0 #5a0000,0 10px 24px #000}
.sub{color:#d9a0a0;font-size:14px;margin-top:-6px;text-align:center}
input{font-size:20px;padding:10px 14px;border-radius:12px;border:3px solid #ff3b3b;background:#200a0a;color:#fff;width:200px;text-align:center;font-weight:700;outline:none}
button{font-size:20px;border:0;border-radius:14px;background:#ff3b3b;color:#fff;font-weight:900;padding:10px 20px;box-shadow:0 4px 0 #6b0000;cursor:pointer}
button.alt{background:#2a1212;border:2px solid #ff3b3b;box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#rooms{display:flex;flex-direction:column;gap:6px;width:min(520px,94vw);max-height:38vh;overflow:auto}
.room{display:flex;align-items:center;gap:10px;background:#220c0c;border:2px solid #4a1818;border-radius:12px;padding:8px 12px}
.room .i{flex:1;font-size:14px;color:#ddd}.room .i b{color:#fff;font-size:16px}
.room button{font-size:16px;padding:6px 14px}
#plist{display:flex;flex-direction:column;gap:6px;width:min(360px,90vw)}
.pl{background:#220c0c;border-radius:10px;padding:8px 12px;font-weight:800;border-left:6px solid var(--c)}
#code{font-size:30px;font-weight:900;letter-spacing:6px;color:#ffd43b}
.hint{font-size:13px;color:#b98a8a;text-align:center;max-width:520px}
#err{color:#ffb3b3;min-height:1.2em;font-size:14px}
#start.scr{justify-content:flex-start;gap:0;padding:clamp(12px,3vh,32px) 16px 20px;background:radial-gradient(ellipse at 48% 25%,#382a25 0,#221c1a 42%,#111312 86%);color:#f2e9dc;scrollbar-width:thin}
.start-shell{width:min(100%,760px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:13px}
.start-title{text-align:center}
.start-title h1{font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:.1em;color:#f6e5cc;text-shadow:0 3px 20px #0008}
.start-title .sub{margin:6px 0 0;color:#ccbba9}
.hero-select{width:min(100%,620px);padding:12px;box-sizing:border-box;border:1px solid #655749;border-radius:17px;background:#151717d9;box-shadow:0 14px 36px #0005}
.hero-heading{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;text-align:center;margin-bottom:10px}
.hero-heading h2{font-size:19px;margin:0;font-weight:750;color:#f6e5cc}
.hero-heading button{width:44px;height:44px;padding:0;font-size:22px;border:1px solid #776454;border-radius:9px;background:#302925;color:#ffddb3;box-shadow:none}
.hero-stage{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-visual{position:relative;min-width:0;margin:0;overflow:hidden;border:1px solid #5c4d42;border-radius:10px;aspect-ratio:1;max-height:clamp(145px,35vh,280px);background:radial-gradient(ellipse at 50% 66%,#58483b,#1c2021 72%)}
.hero-visual img,#skin{width:100%;height:100%;display:block;object-fit:contain}
.hero-visual img{object-fit:cover;object-position:center 37%}
.hero-profile{margin:10px 0}
#hero-name{font-size:20px;color:#ffd8a7}
#hero-roster{position:relative;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;padding-bottom:4px;scrollbar-width:thin;touch-action:pan-x pan-y}
#hero-roster button{flex:1 0 clamp(66px,12vw,86px);min-width:0;padding:3px;display:grid;gap:3px;justify-items:center;font-size:11px;line-height:1.15;border-radius:7px;border:1px solid #645647;-webkit-tap-highlight-color:transparent;color:#ede2d4;background:#322a25;box-shadow:none;scroll-snap-align:start}
#hero-roster button[aria-pressed="true"]{border-color:#ffbc7a;background:#5a3e2b;color:#fff5e2}
#hero-roster button:focus-visible,.hero-heading button:focus-visible{outline:2px solid #ffcb95;outline-offset:-2px}
@media (min-width:650px) and (min-height:521px){#hero-roster button{flex:1 1 0}}
#hero-roster img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 29%;border-radius:4px}
.start-actions{width:min(100%,620px);display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.start-actions input,.start-actions button{box-sizing:border-box;min-height:44px;font-size:16px;border-radius:8px;padding:8px 12px}
.start-actions input{width:min(100%,160px);background:#222422;border:1px solid #6f5e50;color:#f9eee0}
.start-actions #quick{background:#e3613e;color:#180e0a;box-shadow:0 2px 0 #853b2a}
.start-actions #create{background:#292422;border:1px solid #937259;color:#ffe4c8}
.start-shell #rooms{width:min(100%,520px)}
.start-shell .hint{color:#c2af9b;margin:0}
#err:empty,#rec:empty{display:none}
@media (orientation:landscape) and (max-height:520px){
  .start-shell{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto auto auto auto 1fr;align-items:start;gap:8px 14px}
  .start-shell>*{grid-column:2}
  .hero-select{grid-column:1;grid-row:1/span 6;padding:8px}
  .start-actions{justify-content:stretch}
  .start-actions input{width:100%}
  .start-actions button{flex:1 1 auto}
  #start #rooms{width:100%;max-height:28vh}
  .hero-visual{max-height:154px}
  .hero-profile{margin:6px 0}
  .start-title h1{font-size:32px}
  #hero-roster img{aspect-ratio:1.8}
}
</style></head><body>
<canvas id="g"></canvas><canvas id="c"></canvas>
<div id="weapons" role="group" aria-label="Оружие" hidden></div>
<div id="start" class="scr on">
  <div class="start-shell">
    <header class="start-title"><h1>LAST EXIT</h1><p class="sub">Отбивайтесь от налётчиков вместе · до 4 игроков</p></header>
    <section class="hero-select" aria-labelledby="hero-heading">
      <div class="hero-heading">
        <button id="skp" type="button" aria-label="Предыдущий персонаж">‹</button>
        <h2 id="hero-heading">Выбери персонажа</h2>
        <button id="skn" type="button" aria-label="Следующий персонаж">›</button>
      </div>
      <div class="hero-stage">
        <figure class="hero-visual"><img id="hero-photo" alt=""></figure>
        <figure class="hero-visual"><canvas id="skin" width="260" height="260" role="img"></canvas></figure>
      </div>
      <div class="hero-profile" aria-live="polite"><strong id="hero-name"></strong></div>
      <div id="hero-roster" role="group" aria-label="Персонажи"></div>
    </section>
    <div class="start-actions">
      <input id="name" maxlength="12" placeholder="Имя игрока" aria-label="Имя игрока" autocomplete="off">
      <button id="quick" type="button">Быстрая игра</button><button id="create" class="alt" type="button">Своя комната</button>
    </div>
    <div id="err" role="alert"></div>
    <p class="hint" id="rooms-hint">Идущие игры</p>
    <div id="rooms"></div>
    <p class="hint" id="rec"></p>
  </div>
</div>
<div id="lobby" class="scr">
  <div class="sub">Комната</div><div id="code"></div>
  <div class="row"><button id="share" class="alt">🔗 Позвать друга</button></div>
  <div id="plist"></div>
  <div class="hint">Ждите друзей и жмите «Старт». Можно начинать и одному — к вам смогут подключиться.</div>
  <div class="row"><button id="go">▶ СТАРТ</button><button id="leave" class="alt">Выйти</button></div>
</div>
<script src="/three.min.js"></script>
<script>
/*SHARED*/
/*CLIENT*/
</script>
</body></html>
