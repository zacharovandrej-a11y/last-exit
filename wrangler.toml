# Cloudflare Worker «LAST EXIT». Разворачивается автоматически при push в main.
name = "last-exit"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ZWorld"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Lobby"]
deleted_classes = ["ZWorld"]
